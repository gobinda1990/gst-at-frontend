# Auth service (login + refresh-token). Change to your auth service host:port
# (use the docker service name if it runs in the same compose network).
upstream auth_backend {
    server auth:8081;
    keepalive 16;
}

# GST return 3B analysis backend
upstream api_backend {
    server gst-retun-3b-analysis:8087;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Large JSON / CSV exports
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # ------------------------------------------------------------
    # React frontend
    # ------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so new builds are picked up
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------
    # Auth API: login + refresh-token  (browser calls /api/auth/...)
    # Must stay same-origin so the HttpOnly SameSite=Lax refresh_token
    # cookie is sent by the browser.
    # No URI part in proxy_pass -> path is forwarded unchanged:
    #   /api/auth/refresh-token -> http://auth_backend/api/auth/refresh-token
    # ------------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://auth_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Browser sends the refresh_token cookie; pass it through
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;

        # If the auth server sets Domain=10.153.43.8 on the cookie, rewrite it
        # so the browser accepts it for this site. Host-only cookies need nothing.
        proxy_cookie_domain 10.153.43.8 $host;

        # When you move to HTTPS, uncomment:
        # proxy_cookie_flags refresh_token secure samesite=lax;

        # Never cache auth responses
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ------------------------------------------------------------
    # Backend API
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-ID $http_x_client_id;

        # Matches the 120s axios timeout (long analytics / exports)
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}



